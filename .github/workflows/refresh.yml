name: Daily refresh

on:
  schedule:
    # Two refreshes/day: 12:00 UTC = 08:00 ET (morning), 00:00 UTC = 20:00 ET
    # (evening). GitHub cron is best-effort, actual fire time can lag
    # by 5-30 min.
    - cron: '0 12 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:  # manual button in Actions tab

# Shared group with market-refresh.yml so the two workflows never race
# each other's commit step.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run full pipeline
        run: python -u run_all.py

      # Rebuild the Model vs Markets tab data against the fresh polls/markets. The model
      # predictions are committed snapshots (data/processed/model_*.csv), refreshed locally via
      # the model repo's refresh_dashboard.py; this step re-prices the market side.
      # continue-on-error so a compare crash can't block the data-refresh commit; the final
      # step re-raises the failure AFTER the commit so the run still shows red.
      - name: Model vs markets compare
        id: modelcompare
        continue-on-error: true
        run: |
          python analysis/model_compare.py
          python analysis/model_compare_primary.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
            # Retry-with-rebase loop for race conditions when another push lands
            # between checkout and push (3 attempts).
            #
            # The bare `git pull --rebase` here used to be enough, but docs/*.js are
            # GENERATED files: when the other side has also regenerated them the rebase
            # stops on a conflict, and because nothing resolved it every later attempt
            # failed on a dirty tree (both Daily refresh runs on 2026-08-03 died this
            # way). Generated files must never be merge-resolved - take EITHER side to
            # get the rebase moving, then REGENERATE them from source, which is the only
            # correct content. Same approach model-refresh.yml has used since 2026-07-18.
            CONFLICTABLE="docs/model_data.js docs/primary_model_data.js docs/arb_data.js"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push rejected, rebasing on origin/master (attempt $i)…"
              if ! git pull --rebase origin master; then
                git checkout --theirs $CONFLICTABLE 2>/dev/null || true
                git add $CONFLICTABLE 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              fi
              python analysis/model_compare.py || true
              python analysis/model_compare_primary.py || true
              python scripts/arb_scanner.py || true
              git add docs/ data/
              git diff --cached --quiet || git commit -m "regen after rebase"
            done
          fi

      - name: Fail loudly if model compare crashed
        if: steps.modelcompare.outcome == 'failure'
        run: |
          echo "::error::model_compare.py failed — the Model vs Markets tab is serving STALE data"
          exit 1
