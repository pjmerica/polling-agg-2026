name: Election night (cloud)

# Election night without the PC: "Election night simulator/scripts/cloud_night.py" records NYT's
# county results and Kalshi/Polymarket prices and runs the projector every 2 minutes (5 from
# Wed 1 pm ET), keeping its state on the orphan branch `election-live` (one commit, force-pushed).
# docs/election-night-cloud.html and docs/election-night-desk.html read live_data.js from that branch.
#
# A job runs ~5h40m (GitHub stops jobs at 6h), then dispatches the next one, which waits in the
# concurrency group and starts when this one ends. The cron is only a backstop if a job dies:
# GitHub's scheduled runs start late or not at all. Stops after Dec 14 (cloud_night.END; was Nov 7): the late count.

on:
  schedule:
    - cron: '*/30 * * 11 *'
    - cron: '*/30 * 1-14 12 *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'job length, minutes'
        default: '340'
      chain:
        description: 'dispatch the next job when this one ends'
        type: boolean
        default: true

concurrency:
  group: election-night
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write        # push the election-live branch
      actions: write         # dispatch the next job
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            utils
            docs/forecast_data.js
            State election results/scripts
            State election results/data/processed/state_timeseries.csv
            State election results/data/processed/county_benchmarks.json
            State election results/data/processed/county_benchmarks_extra.json
            State election results/data/processed/county_benchmarks_all.json
            State election results/data/processed/early_vote_2026.csv
            Election night simulator/scripts

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install pandas numpy

      - name: Check out the state branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" election-live >/dev/null; then
            git clone -q --depth 1 --branch election-live "$url" state
          else
            git init -q -b election-live state
            git -C state remote add origin "$url"
          fi
          git -C state config user.name "election-night"
          git -C state config user.email "actions@users.noreply.github.com"
          date -u +%s > started

      # The raw record of the night (cloud_night.py: every NYT change, all 50 state pages, books, the projector's
      # inputs and outputs) is attached to this release every hour, so it outlives the 90-day artifacts.
      - name: Make sure the archive release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view election-night-2026 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create election-night-2026 --repo "$GITHUB_REPOSITORY" --latest=false \
              --title "Election night 2026: raw record" \
              --notes "Recorded by the Election night (cloud) workflow for a 2026 replay: every change of NYT's results files for the tracked races (2-minute checks), NYT's 50 state pages (10-minute checks), Kalshi/Polymarket books, the projector's inputs and its output every 10 minutes. One tar.gz per job-hour (night-<run id>-<n>.tar.gz); unpack them all into one folder."

      - name: Record and project
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python "Election night simulator/scripts/cloud_night.py"
          --state state --archive archive --minutes "${{ inputs.minutes || '340' }}"

      # Only after a full-length job: a job that dies in its first minutes must not dispatch itself
      # in a tight loop (the cron restarts it instead).
      - name: Dispatch the next job
        if: ${{ always() && (github.event_name == 'schedule' || inputs.chain) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ran=$(( $(date -u +%s) - $(cat started) ))
          if [ "$ran" -gt 1200 ] && [ "$(date -u +%s)" -lt "$(date -u -d 2026-12-15T05:00:00Z +%s)" ]; then
            gh workflow run election-night.yml --repo "$GITHUB_REPOSITORY" --ref master
            echo "dispatched the next job after ${ran}s"
          else
            echo "not dispatching (ran ${ran}s)"
          fi

      # The release has the archive (hourly + at the end); the artifact is the fallback when an upload failed
      # (cloud_night.py leaves upload_failed) or the job didn't finish cleanly. Skipped otherwise: the next job
      # can't start until this one ends, so an upload here would lengthen the hand-off gap.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (hashFiles('upload_failed') != '' || steps.record.outcome != 'success') }}
        with:
          name: nyt-captures-${{ github.run_id }}
          path: archive
          if-no-files-found: ignore
          retention-days: 90
